# Databases for the week-1 benchmark. Both get enough memory to hold the
# 10-million-row tables, so the benchmark measures CPU cost, not disk.
#
#   docker compose -f bench/docker-compose.yml up -d --wait
#   go run ./bench -engine postgres -dsn postgres://maskplan:maskplan@localhost:55432/maskplan
#   go run ./bench -engine mysql -dsn 'root:maskplan@tcp(127.0.0.1:53306)/maskplan'
#   docker compose -f bench/docker-compose.yml down -v

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: maskplan
      POSTGRES_PASSWORD: maskplan
      POSTGRES_DB: maskplan
    command: ["postgres", "-c", "shared_buffers=2GB", "-c", "max_parallel_workers_per_gather=2"]
    shm_size: 2gb
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maskplan"]
      interval: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: maskplan
      MYSQL_DATABASE: maskplan
    command: ["--innodb-buffer-pool-size=4G"]
    ports: ["53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmaskplan"]
      interval: 5s
      retries: 30
