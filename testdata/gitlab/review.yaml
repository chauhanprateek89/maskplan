# Review of maskplan scan on GitLab's database schema (db/structure.sql, no data).
# Scanned by name and type only: the tables are empty, as a fresh install's are.
#
# Precision: every column scan labeled as personal data was judged by hand.
# A label counts as correct when the column holds data about a person
# (contact details, names, usernames, a user's IP address), a credential, or
# text end users write about their work (issue and merge request
# descriptions, notes, commit messages). Configuration, system-generated
# text, machine identifiers and names of things are not. Secrets are all
# correct unless listed; free_text labels are correct only if listed; other
# labels are correct unless listed. Judged by maskplan's author.
#
# Recall: a random sample of the columns scan left as none (Python
# random.seed(2), random.sample of 400), each judged by hand. The sample was
# drawn after the last rule change and nothing was tuned on it.
